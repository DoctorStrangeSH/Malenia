name: Desktop checks

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm install
      - name: Build frontend
        working-directory: desktop
        run: npm run build
      - name: Test Browser Bridge connection diagnostics
        run: node --test tests/browser_bridge.test.cjs
      - name: Test current-tab source binding
        run: node --test tests/browser_active_source.test.cjs
      - name: Test Browser Bridge source configuration
        run: node --test tests/browser_targets.test.cjs
      - name: Test autonomous browser traversal
        run: node --test tests/browser_automation.test.cjs tests/browser_work_tabs.test.cjs
      - name: Test normalized DataLens history title binding
        run: node scripts/check-history-title.cjs
      - name: Test Asgard card identity and history in a real DOM
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/malenia-dom" --no-save jsdom@26.1.0 react@18.3.1 react-dom@18.3.1 playwright@1.56.1
          $env:NODE_PATH = "$env:RUNNER_TEMP/malenia-dom/node_modules"
          node scripts/verify-asgard-cards.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-asgard-order-cards.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/verify-work-tabs.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test DataLens empty results with real React controls
        shell: pwsh
        run: |
          $env:NODE_PATH = "$env:RUNNER_TEMP/malenia-dom/node_modules"
          node scripts/verify-datalens-empty.cjs
      - name: Exercise desktop workflow in Chromium
        shell: pwsh
        run: |
          $env:NODE_PATH = "$env:RUNNER_TEMP/malenia-dom/node_modules"
          & "$env:RUNNER_TEMP/malenia-dom/node_modules/.bin/playwright.cmd" install chromium
          node scripts/verify-desktop-ui.cjs
      - name: Upload desktop UI previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malenia-desktop-ui-previews
          path: ${{ runner.temp }}/malenia-ui/*.png
          if-no-files-found: ignore
      - name: Test whole-sheet automatic continuation and pause
        run: node --test tests/inventa_run.test.cjs
      - name: Test desktop-triggered browser audit dispatch
        run: node --test tests/browser_desktop_dispatch.test.cjs
      - name: Test permission panel rendering
        run: node --test tests/permissions_ui.test.cjs
      - name: Test AI task review and retry
        run: node --test tests/ai_ui.test.cjs
      - name: Test primary assistant navigation and task labels
        run: node --test tests/navigation_ui.test.cjs
      - name: Check Tauri host
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
      - name: Test runtime archive verification
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
      - name: Install official portable runtime on disposable runner
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml official_runtime_install -- --ignored
      - name: Run Python unit tests
        env:
          PYTHONPATH: agent
        run: python -m unittest discover -s tests -v
